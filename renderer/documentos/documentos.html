<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentos | Gestor de Capacitación</title>
  <link rel="stylesheet" href="../shared/menu.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="./documentos.css" />
  <link rel="stylesheet" href="../shared/simple.css" />
</head>
<body data-active-menu="documentos">
  <div data-menu-root></div>

  <main class="page-shell">
    <header class="page-header">
      <div><h1>Documentos</h1></div>
    </header>

    <section class="document-tabs" aria-label="Tipos documentales">
      <button class="document-tab active" data-document-tab="plan-individual">
        <strong>Planes</strong>
        <span>RGI1 · PRO-251</span>
      </button>
      <button class="document-tab" data-document-tab="acuerdo-patrocinio">
        <strong>Acuerdos</strong>
        <span>RGI2 · PRO-134</span>
      </button>
      <button class="document-tab" data-document-tab="planificacion-capacitacion">
        <strong>Planificaciones</strong>
        <span>RGI1 · PRO-134</span>
      </button>
      <button class="document-tab" data-document-tab="informe-final-capacitacion">
        <strong>Informes</strong>
        <span>INF · PRO-134</span>
      </button>
      <button class="document-tab" data-document-tab="instrumento-evaluacion">
        <strong>Evaluaciones</strong>
        <span>PRO-135</span>
      </button>
      <button class="document-tab" data-document-tab="informe-impacto">
        <strong>Impacto</strong>
        <span>PRO-135</span>
      </button>
    </section>

    <section class="card" id="documentWorkspace">
      <div class="workspace-head">
        <div>
          <h2 class="section-title" id="workspaceTitle">Planes</h2>
          <p class="section-description" id="workspaceDescription"></p>
        </div>
        <span class="workspace-code" id="workspaceCode"></span>
      </div>

      <div class="actions workspace-actions">
        <button class="btn-primary" id="btnSelectDocuments" title="Seleccionar PDF">PDF</button>
        <button class="btn-secondary" id="btnSelectDocumentFolder" title="Cargar carpeta con PDF">Carpeta</button>
        <button class="btn-secondary" id="btnValidateDocuments" disabled>Validar</button>
        <button class="btn-secondary" id="btnChooseOutput" title="Seleccionar carpeta de salida">Salida</button>
        <button class="btn-primary" id="btnGenerateDocuments" disabled>Procesar</button>
        <button class="btn-danger" id="btnClearDocuments" disabled>Limpiar</button>
      </div>

      <div class="output-row">
        <div class="status-box status-info" id="documentStatus">Sin archivos.</div>
        <div class="status-box status-info" id="outputStatus">Sin carpeta de salida.</div>
      </div>

      <div class="progress-panel hidden" id="ocrProgressPanel">
        <strong id="ocrProgressTitle">Procesando...</strong>
        <span id="ocrProgressDetail">Preparando OCR.</span>
        <div class="progress-track"><div class="progress-bar" id="ocrProgressBar"></div></div>
      </div>

      <div class="summary-grid">
        <div class="summary-item"><span>Archivos</span><strong id="summarySelected">0</strong></div>
        <div class="summary-item"><span>Válidos</span><strong id="summaryValid">0</strong></div>
        <div class="summary-item"><span>Revisar</span><strong id="summaryInvalid">0</strong></div>
        <div class="summary-item"><span>Digital</span><strong id="summaryDigital">0</strong></div>
        <div class="summary-item"><span>OCR</span><strong id="summaryOcr">0</strong></div>
        <div class="summary-item"><span>Listo</span><strong id="summaryReady">No</strong></div>
      </div>

      <div id="selectedDocuments"><div class="empty">Sin archivos.</div></div>
      <div id="documentResult"></div>
    </section>
  </main>

  <script src="../shared/menu.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="./secciones/planes.section.js"></script>
  <script src="./secciones/acuerdos.section.js"></script>
  <script src="./secciones/planificaciones.section.js"></script>
  <script src="./secciones/informes-finales.section.js"></script>
  <script src="./secciones/instrumentos-evaluacion.section.js"></script>
  <script src="./secciones/informes-impacto.section.js"></script>
  <script src="./documentos.js"></script>
  <script src="../shared/compact-ui.js"></script>
</body>
</html>
