<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informe | Gestor de Capacitación</title>
  <link rel="stylesheet" href="../shared/menu.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="./informe-cumplimiento.css" />
  <link rel="stylesheet" href="../shared/simple.css" />
</head>
<body data-active-menu="informe-cumplimiento">
  <div data-menu-root></div>
  <main class="page-shell">
    <header class="page-header">
      <div><h1>Informe</h1></div>
      <div class="actions">
        <button class="btn-secondary" id="btnRefreshCompliance">Actualizar</button>
        <button class="btn-secondary" id="btnRunInternalAnalysis">Analizar</button>
        <button class="btn-secondary" id="btnOpenAiConfiguration">IA</button>
        <button class="btn-primary" id="btnGoToExport">Generar</button>
      </div>
    </header>

    <section class="card filters-grid">
      <label>Periodo<select id="compliancePeriod"><option value="">Todos</option></select></label>
      <label>Carrera<select id="complianceCareer"><option value="">Todas</option></select></label>
      <label>Modalidad<select id="complianceModality"><option value="">Todas</option></select></label>
      <label>Buscar<input id="complianceQuery" type="search" placeholder="Docente o capacitación" /></label>
      <button class="btn-secondary filter-button" id="btnApplyComplianceFilters">Filtrar</button>
    </section>

    <div class="status-box status-info" id="complianceStatusBox">Cargando...</div>
    <section id="complianceAnalysisState" class="analysis-state"></section>
    <section id="complianceMetrics" class="metrics-grid"></section>

    <section class="dashboard-grid">
      <article class="card"><h2>Documentación</h2><div id="chartDocumentaryCoverage"></div></article>
      <article class="card"><h2>Horas</h2><div id="chartHours"></div></article>
      <article class="card"><h2>Carreras</h2><div id="chartCareers"></div></article>
      <article class="card"><h2>Brechas</h2><div id="chartGaps"></div></article>
    </section>

    <section class="compliance-workspace">
      <aside class="card guides-panel collapsed" id="guidesPanel">
        <div class="panel-heading">
          <div><h2>Guías</h2></div>
          <button class="icon-button" id="btnToggleGuides" title="Mostrar u ocultar guías">›</button>
        </div>
        <div id="guideList" class="guide-list"></div>
        <div class="guide-editor" id="guideEditor">
          <h3 id="guideEditorHeading">Guía</h3>
          <label>Título<input id="guideTitle" /></label>
          <label>Instrucciones<textarea id="guideInstructions" rows="5"></textarea></label>
          <label>Datos<input id="guideDataScope" placeholder="metrics, gaps, analysis" /></label>
          <label>Tono<input id="guideTone" /></label>
          <div class="guide-form-row">
            <label>Palabras<input id="guideMaxWords" type="number" min="50" max="5000" /></label>
            <label>Proveedor<select id="guideProviderPreference">
              <option value="AUTO">Automático</option>
              <option value="PRIMARY">Principal</option>
              <option value="SECONDARY">Secundaria</option>
              <option value="BACKUP">Respaldo</option>
              <option value="INTERNAL">Interno</option>
            </select></label>
          </div>
          <label class="checkbox-line"><input id="guideEnabled" type="checkbox" checked /> Activa</label>
          <label>Prueba<select id="guideTestMode"><option value="INTERNAL">Interno</option><option value="AI">IA</option></select></label>
          <label class="checkbox-line"><input id="guideUseAiGeneration" type="checkbox" /> Usar IA</label>
          <div class="guide-actions">
            <button class="btn-primary btn-small" id="btnSaveGuide">Guardar</button>
            <button class="btn-secondary btn-small" id="btnTestGuide">Probar</button>
            <button class="btn-secondary btn-small" id="btnRestoreGuide">Restaurar</button>
          </div>
          <div id="guideTestResult" class="guide-test-result"><div class="empty compact">Sin prueba.</div></div>
        </div>
      </aside>

      <section class="workspace-main">
        <article class="card">
          <div class="panel-heading"><div><h2>Secciones</h2></div><span id="sectionCountBadge" class="count-badge">0</span></div>
          <div id="complianceSections" class="section-cards"><div class="empty">Cargando...</div></div>
        </article>
        <article class="card"><h2>Alertas</h2><div id="complianceAlerts"></div></article>
      </section>
    </section>

    <section class="card export-center" id="complianceExportCenter">
      <div class="panel-heading"><div><h2>Generar informe</h2></div></div>
      <div class="export-grid">
        <fieldset><legend>Alcance</legend>
          <label><input type="radio" name="exportScope" value="SELECTED" checked /> Seleccionadas</label>
          <label><input type="radio" name="exportScope" value="FULL" /> Completo</label>
        </fieldset>
        <fieldset><legend>Formato</legend>
          <label><input type="radio" name="exportFormat" value="DOCX" /> Word</label>
          <label><input type="radio" name="exportFormat" value="PDF" /> PDF</label>
          <label><input type="radio" name="exportFormat" value="BOTH" checked /> Ambos</label>
        </fieldset>
        <fieldset class="export-options"><legend>Opciones</legend>
          <label><input id="exportIncludeCharts" type="checkbox" checked /> Gráficos</label>
          <label><input id="exportIncludeTables" type="checkbox" checked /> Tablas</label>
          <label><input id="exportIncludeAnnexes" type="checkbox" checked /> Anexos</label>
          <label><input id="exportIncludeCareerDetail" type="checkbox" checked /> Por carrera</label>
          <label><input id="exportIncludeTrainingDetail" type="checkbox" checked /> Por capacitación</label>
          <label><input id="exportIncludeAlerts" type="checkbox" checked /> Alertas</label>
        </fieldset>
      </div>
      <div class="export-actions"><span id="exportSelectionSummary">0 seleccionadas</span><button class="btn-primary" id="btnExportCompliance">Generar</button></div>
    </section>
  </main>

  <div class="modal-backdrop" id="aiConfigurationModal" aria-hidden="true">
    <section class="modal-window" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
      <header class="modal-header"><div><h2 id="aiModalTitle">IA</h2></div><button class="icon-button" id="btnCloseAiConfiguration" aria-label="Cerrar">×</button></header>
      <div id="aiProvidersContainer" class="ai-providers"></div>
      <div class="modal-status" id="aiModalStatus">Configura y prueba.</div>
      <footer class="modal-footer"><button class="btn-secondary" id="btnTestAiChain">Probar IA</button><div><button class="btn-secondary" id="btnCancelAiConfiguration">Cerrar</button><button class="btn-primary" id="btnSaveAiConfiguration">Guardar</button></div></footer>
    </section>
  </div>

  <script src="../shared/menu.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="./componentes/panel-guias.component.js"></script>
  <script src="./componentes/estado-secciones.component.js"></script>
  <script src="./componentes/centro-exportacion.component.js"></script>
  <script src="./componentes/modal-ia.component.js"></script>
  <script src="./informe-cumplimiento.js"></script>
  <script src="../shared/compact-ui.js"></script>
</body>
</html>
