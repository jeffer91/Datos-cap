<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base | Gestor de Capacitación</title>
  <link rel="stylesheet" href="../shared/menu.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="../shared/simple.css" />
</head>
<body data-active-menu="base">
  <div data-menu-root></div>

  <main class="page-shell">
    <header class="page-header">
      <div><h1>Base</h1></div>
      <div class="actions">
        <button class="btn-secondary" id="btnRefreshBase">Actualizar</button>
        <button class="btn-primary" id="btnOpenBaseFolder">Carpeta</button>
      </div>
    </header>

    <section class="card">
      <div class="base-tabs" aria-label="Vistas de la base">
        <button class="base-tab active" data-base-view="resumen">Resumen</button>
        <button class="base-tab" data-base-view="documentos">Documentos</button>
        <button class="base-tab" data-base-view="tipos">Tipos</button>
        <button class="base-tab" data-base-view="detalles">Detalle</button>
        <button class="base-tab" data-base-view="procesamientos">Historial</button>
      </div>

      <div class="base-toolbar">
        <div class="base-toolbar-left">
          <input type="search" id="baseSearch" placeholder="Buscar" />
          <select id="basePeriod" class="type-filter">
            <option value="">Todos los periodos</option>
          </select>
          <select id="baseDocumentType" class="type-filter">
            <option value="">Todos los tipos</option>
            <option value="plan-individual">Planes</option>
            <option value="acuerdo-patrocinio">Acuerdos</option>
            <option value="planificacion-capacitacion">Planificaciones</option>
            <option value="informe-final-capacitacion">Informes</option>
            <option value="instrumento-evaluacion">Evaluaciones</option>
            <option value="informe-impacto">Impacto</option>
          </select>
          <label><input type="checkbox" id="baseReviewOnly" /> Revisar</label>
        </div>
        <button class="btn-secondary" id="btnApplyBaseFilters">Filtrar</button>
      </div>

      <div class="status-box status-info" id="baseStatus">Cargando...</div>
      <div class="base-view" id="baseView"><div class="empty">Cargando...</div></div>
    </section>
  </main>

  <script src="../shared/menu.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="./vistas/resumen.view.js"></script>
  <script src="./vistas/documentos.view.js"></script>
  <script src="./vistas/tipos.view.js"></script>
  <script src="./vistas/detalles.view.js"></script>
  <script src="./vistas/procesamientos.view.js"></script>
  <script src="./base.js"></script>
  <script src="../shared/compact-ui.js"></script>
</body>
</html>
